apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mycelium-node-state
  namespace: mycelium
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycelium-node
  namespace: mycelium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mycelium-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mycelium-node
    spec:
      serviceAccountName: mycelium-node
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: node
          image: ghcr.io/mycelium-app/mycelium:latest
          command: ["dumb-init", "mycelium", "node", "run"]
          env:
            - name: MYCELIUM_NODE_CONFIG
              value: /etc/mycelium/node.toml
            - name: MYCELIUM_KUBERNETES_ENABLED
              value: "true"
            - name: MYCELIUM_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MYCELIUM_KUBERNETES_IMAGE
              value: ghcr.io/mycelium-app/mycelium-agent:latest
            - name: MYCELIUM_KUBERNETES_CREDENTIALS_SECRET
              value: mycelium-agent-credentials
          volumeMounts:
            - name: credential
              mountPath: /etc/mycelium
              readOnly: true
            - name: state
              mountPath: /var/lib/mycelium
      volumes:
        - name: credential
          secret:
            secretName: mycelium-node-credential
            defaultMode: 0400
        - name: state
          persistentVolumeClaim:
            claimName: mycelium-node-state
