apiVersion: v1
kind: ServiceAccount
metadata:
  name: mycelium-node
  namespace: mycelium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mycelium-node
  namespace: mycelium
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mycelium-agent-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycelium-node
  namespace: mycelium
subjects:
  - kind: ServiceAccount
    name: mycelium-node
    namespace: mycelium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mycelium-node
