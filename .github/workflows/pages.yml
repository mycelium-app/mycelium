name: Landing page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - design/tokens.css
      - design/mycelium.css
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble
        run: |
          mkdir -p public
          cp -r site/. public/
          cp design/tokens.css design/mycelium.css public/
          for file in index.html site.css tokens.css mycelium.css logo.svg favicon.svg hero.jpg; do
            test -f "public/$file" || { echo "::error::public/$file is missing"; exit 1; }
          done

      - name: AI disclosure comes before the hero
        run: |
          body=$(grep -n '<body>' public/index.html | head -1 | cut -d: -f1)
          disclosure=$(grep -n 'aria-label="AI disclosure"' public/index.html | head -1 | cut -d: -f1)
          hero=$(grep -n '<header' public/index.html | head -1 | cut -d: -f1)
          test -n "$disclosure" || { echo "::error::no AI disclosure on the page"; exit 1; }
          test "$body" -lt "$disclosure" || { echo "::error::the disclosure is not inside the body"; exit 1; }
          test "$disclosure" -lt "$hero" || { echo "::error::the disclosure must come before the hero"; exit 1; }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
