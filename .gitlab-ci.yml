workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - pages
  - build
  - release

pages:
  stage: pages
  image: alpine:latest
  needs: []
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - site/**/*
        - design/*.css
        - .gitlab-ci.yml
  script:
    - mkdir -p public
    - cp -r site/. public/
    # The page and the app share one design system: tokens.css and mycelium.css live in design/.
    - cp design/tokens.css design/mycelium.css public/
    - test -f public/index.html
    - test -f public/site.css
    - test -f public/tokens.css
    - test -f public/mycelium.css
    - test -f public/logo.svg
    - test -f public/favicon.svg
    - test -f public/hero.jpg
    - test -f public/install.md
    - |
      body=$(grep -n '<body>' public/index.html | head -1 | sed 's/[^0-9].*//')
      disc=$(grep -n 'aria-label="AI disclosure"' public/index.html | head -1 | sed 's/[^0-9].*//')
      hero=$(grep -n '<header' public/index.html | head -1 | sed 's/[^0-9].*//')
      test -n "$disc" || { echo "no AI disclosure on the page"; exit 1; }
      test "$body" -lt "$disc" || { echo "disclosure is not inside the body"; exit 1; }
      test "$disc" -lt "$hero" || { echo "disclosure must come before the hero"; exit 1; }
      echo "AI disclosure present at line $disc, ahead of the hero at $hero"
  pages: true
  artifacts:
    paths:
      - public

variables:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mycelium-app/mycelium
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_BUILDKIT: "1"
  S3_ENDPOINT: "https://s3.example.com"
  S3_BUCKET: "artefacts"
  S3_PREFIX: "mycelium"
  S3_PUBLIC: "https://github.com/mycelium-app/mycelium/releases/download"

.release_rule: &release_rule
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

build:image:
  stage: build
  image: docker:27
  needs: []
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - Cargo.toml
        - Cargo.lock
        - crates/**/*
        - clients/**/*
        - .gitlab-ci.yml
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
  script:
    - docker build
        -f Dockerfile
        --build-arg "MYCELIUM_VERSION=${CI_COMMIT_SHORT_SHA}"
        -t "$IMAGE:${CI_COMMIT_SHORT_SHA}"
        -t "$IMAGE:latest"
        .
    - docker push "$IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$IMAGE:latest"

.binary:
  stage: build
  needs: []
  <<: *release_rule
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "cargo-$RUST_TARGET"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  script:
    - MYCELIUM_VERSION="$CI_COMMIT_TAG" cargo build --release --locked --package mycelium-cli --target "$RUST_TARGET"
    - cp "target/$RUST_TARGET/release/mycelium" "$ASSET"
    - sha256sum "$ASSET" | cut -d' ' -f1 > "$ASSET.sha256"
  artifacts:
    paths: ["$ASSET", "$ASSET.sha256"]
    expire_in: 1 week

binary:x86_64:
  extends: .binary
  image: messense/rust-musl-cross:x86_64-musl
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUST_TARGET: x86_64-unknown-linux-musl
    ASSET: mycelium-linux-x86_64

.awscli: &awscli
  - curl -fsSL -o /tmp/awscli.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip && unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install
  - aws configure set default.s3.addressing_style virtual
  - aws configure set default.s3.multipart_threshold 1MB
  - aws configure set default.s3.multipart_chunksize 1MB
  - aws configure set default.s3.max_concurrent_requests 4

build:clients:
  stage: build
  image: eclipse-temurin:21-jdk
  needs: []
  <<: *release_rule
  variables:
    GIT_DEPTH: 0
    KEY_ALIAS: "mycelium"
    ANDROID_COMPILE_SDK: "37"
    ANDROID_PLATFORM: "37.0"
    ANDROID_BUILD_TOOLS: "37.0.0"
    ANDROID_CMDLINE_TOOLS: "15859902"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    APK_NAME: "mycelium-android.apk"
  cache:
    key: "clients-$ANDROID_CMDLINE_TOOLS-$ANDROID_COMPILE_SDK-$ANDROID_BUILD_TOOLS"
    paths:
      - .android-sdk/
      - .gradle/caches/
      - .gradle/wrapper/
      - .gradle/nodejs/
      - .gradle/yarn/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip git fakeroot binutils libatomic1 > /dev/null
    - *awscli
    - |
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -fsSL -o /tmp/tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > clients/local.properties
  script:
    - base64 -d < "$ANDROID_KEYSTORE_BASE64" > /tmp/release.keystore
    - cd clients
    - MYCELIUM_VERSION="$CI_COMMIT_TAG" ./gradlew --no-daemon --configuration-cache --stacktrace :androidApp:assembleRelease :desktop:packageDeb :desktop:createDistributable :web:wasmJsBrowserDistribution
    - cp desktop/build/compose/binaries/main/deb/*.deb ../mycelium-desktop-linux-x86_64.deb
    - tar -C desktop/build/compose/binaries/main/app -czf ../mycelium-desktop-linux-x86_64.tar.gz mycelium
    - tar -C web/build/dist/wasmJs/productionExecutable -czf ../mycelium-web.tar.gz .
    - cd ..
    - ci/s3-upload.sh mycelium-desktop-linux-x86_64.deb mycelium-desktop-linux-x86_64.tar.gz mycelium-web.tar.gz
    - export UNSIGNED=$(find clients/androidApp/build/outputs/apk/release -name '*-unsigned.apk' | head -n1)
    - test -n "$UNSIGNED" || { echo 'no APK found'; exit 1; }
    - |
      APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
      "$APKSIGNER" sign \
        --ks /tmp/release.keystore \
        --ks-key-alias "$KEY_ALIAS" \
        --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
        --key-pass "env:ANDROID_KEYSTORE_PASSWORD" \
        --out "$APK_NAME" \
        "$UNSIGNED"
      "$APKSIGNER" verify --verbose "$APK_NAME"
    - shred -u /tmp/release.keystore
    - |
      set -e
      AAPT2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
      BADGING=$("$AAPT2" dump badging "$APK_NAME")
      APK_ID=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
      APK_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
      APK_VERSION=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

      V=${CI_COMMIT_TAG#v}
      EXPECTED_CODE=$(( ${V%%.*} * 10000 + $(echo "$V" | cut -d. -f2) * 100 + $(echo "$V" | cut -d. -f3) ))

      echo "tag=$CI_COMMIT_TAG  apk id=$APK_ID versionCode=$APK_CODE versionName=$APK_VERSION  expected code=$EXPECTED_CODE"

      [ "$APK_ID" = "slop.mycelium" ] || { echo "FAIL: applicationId $APK_ID is not slop.mycelium."; exit 1; }
      [ "$APK_CODE" = "$EXPECTED_CODE" ] || {
        echo "FAIL: APK versionCode $APK_CODE is not the $EXPECTED_CODE derived from $CI_COMMIT_TAG."
        echo "Either CI_COMMIT_TAG never reached Gradle, or a literal has crept back into androidApp/build.gradle.kts."
        exit 1; }
      [ "$APK_VERSION" = "$V" ] || { echo "FAIL: APK versionName $APK_VERSION is not $V."; exit 1; }

      command -v git >/dev/null || { echo 'FAIL: git missing, cannot compare against the previous tag.'; exit 1; }
      PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CI_COMMIT_TAG}$" | head -n1)
      PREV_CODE=0
      if [ -n "$PREV" ]; then
        P=${PREV#v}
        PREV_CODE=$(( ${P%%.*} * 10000 + $(echo "$P" | cut -d. -f2) * 100 + $(echo "$P" | cut -d. -f3) ))
      fi
      echo "previous tag ${PREV:-none}: this build must exceed code $PREV_CODE"
      [ "$APK_CODE" -gt "$PREV_CODE" ] || {
        echo "FAIL: versionCode $APK_CODE is not greater than $PREV_CODE."
        echo "Equal means updaters will never offer this release; lower means Android refuses it. Tag a higher version."
        exit 1; }
      echo "version gate passed"
    - ci/s3-upload.sh "$APK_NAME"
  artifacts:
    paths: [mycelium-desktop-linux-x86_64.tar.gz.sha256]
    expire_in: 1 week

publish:s3:
  stage: release
  image: nixos/nix:latest
  needs:
    - job: binary:x86_64
      artifacts: true
  <<: *release_rule
  before_script:
    - mkdir -p /etc/nix && echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
    - nix-env -iA nixpkgs.awscli2
    - aws configure set default.s3.addressing_style virtual
    - aws configure set default.s3.multipart_threshold 1MB
    - aws configure set default.s3.multipart_chunksize 1MB
    - aws configure set default.s3.max_concurrent_requests 4
  script:
    - export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
    - export AWS_DEFAULT_REGION=us-east-1 AWS_MAX_ATTEMPTS=5 AWS_RETRY_MODE=adaptive
    - DEST="s3://${S3_BUCKET}/${S3_PREFIX}/${CI_COMMIT_TAG}"
    - for file in mycelium-linux-x86_64; do
        aws --endpoint-url "$S3_ENDPOINT" --cli-read-timeout 120 --cli-connect-timeout 30 s3 cp "$file" "$DEST/$file";
        aws --endpoint-url "$S3_ENDPOINT" --cli-read-timeout 120 --cli-connect-timeout 30 s3 cp "$file.sha256" "$DEST/$file.sha256";
      done
    - printf '%s' "$CI_COMMIT_TAG" > latest
    - aws --endpoint-url "$S3_ENDPOINT" s3 cp latest "s3://${S3_BUCKET}/${S3_PREFIX}/latest"
    - aws --endpoint-url "$S3_ENDPOINT" s3 cp install.sh "s3://${S3_BUCKET}/${S3_PREFIX}/install.sh"

publish:flake:
  stage: release
  image: nixos/nix:latest
  needs:
    - job: binary:x86_64
      artifacts: true
    - job: build:clients
      artifacts: true
    - job: publish:s3
  <<: *release_rule
  before_script:
    - mkdir -p /etc/nix && echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
    - nix-env -iA nixpkgs.awscli2 nixpkgs.gnused nixpkgs.gnutar nixpkgs.gzip
    - aws configure set default.s3.addressing_style virtual
  script:
    - ci/release-flake.sh "$CI_COMMIT_TAG" "$(cat mycelium-linux-x86_64.sha256)" "$(cat mycelium-desktop-linux-x86_64.tar.gz.sha256)"
    - ci/s3-upload.sh mycelium-flake.tar.gz
    - export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" AWS_DEFAULT_REGION=us-east-1
    - aws --endpoint-url "$S3_ENDPOINT" s3 cp mycelium-flake.tar.gz "s3://${S3_BUCKET}/${S3_PREFIX}/mycelium-flake.tar.gz"

publish:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [publish:s3, publish:flake, build:clients]
  <<: *release_rule
  script:
    - echo "release ${CI_COMMIT_TAG}"
  release:
    name: "mycelium ${CI_COMMIT_TAG}"
    tag_name: "$CI_COMMIT_TAG"
    description: "mycelium ${CI_COMMIT_TAG}."
    assets:
      links:
        - name: "mycelium-linux-x86_64"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-linux-x86_64"
          link_type: package
        - name: "mycelium-desktop-linux-x86_64.deb"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-desktop-linux-x86_64.deb"
          link_type: package
        - name: "mycelium-desktop-linux-x86_64.tar.gz"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-desktop-linux-x86_64.tar.gz"
          link_type: package
        - name: "mycelium-web.tar.gz"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-web.tar.gz"
          link_type: package
        - name: "mycelium-android.apk"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-android.apk"
          link_type: package
        - name: "mycelium-flake.tar.gz"
          url: "${S3_PUBLIC}/${CI_COMMIT_TAG}/mycelium-flake.tar.gz"
          link_type: package
        - name: "install.sh"
          url: "${S3_PUBLIC}/install.sh"
          link_type: other
