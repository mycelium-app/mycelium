[workspace]
resolver = "3"
members = ["crates/proto", "crates/control", "crates/node", "crates/keeper", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "WTFPL"
publish = false

[workspace.dependencies]
mycelium-proto = { path = "crates/proto" }
mycelium-control = { path = "crates/control" }
mycelium-node = { path = "crates/node" }
mycelium-keeper = { path = "crates/keeper" }

tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
url = "2.5.8"
toml = "1.1.8"
dirs = "7.0.0"
portable-pty = "0.9.0"
notify = "8.2.0"
nix = { version = "0.31.3", features = ["socket", "fs", "process", "signal"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
