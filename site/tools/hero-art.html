<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Hero artwork generator</title>
</head>
<body style="margin: 0">
<canvas id="art" width="2400" height="1350"></canvas>
<script>
const W = 2400;
const H = 1350;
const canvas = document.getElementById('art');
let ctx = canvas.getContext('2d');

function mulberry32(seed) {
  return function next() {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const random = mulberry32(7461001);
const between = (low, high) => low + random() * (high - low);

function paintGround() {
  const ground = ctx.createLinearGradient(0, 0, 0, H);
  ground.addColorStop(0, '#0d1311');
  ground.addColorStop(0.55, '#121a16');
  ground.addColorStop(1, '#1a1f15');
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, W, H);

  const pools = [
    [W * 0.18, H * 0.78, 700, 'rgba(124, 203, 160, 0.10)'],
    [W * 0.72, H * 0.30, 820, 'rgba(124, 203, 160, 0.07)'],
    [W * 0.88, H * 0.86, 520, 'rgba(226, 180, 95, 0.08)'],
    [W * 0.42, H * 0.10, 600, 'rgba(127, 178, 236, 0.05)'],
  ];
  for (const [x, y, r, colour] of pools) {
    const pool = ctx.createRadialGradient(x, y, 0, x, y, r);
    pool.addColorStop(0, colour);
    pool.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = pool;
    ctx.fillRect(0, 0, W, H);
  }
}

function grow(x, y, angle, length, width, depth, layer) {
  let px = x;
  let py = y;
  let heading = angle;
  const steps = Math.max(6, Math.floor(length / 14));
  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 0; i < steps; i++) {
    heading += between(-0.22, 0.22);
    px += Math.cos(heading) * 14;
    py += Math.sin(heading) * 14;
    ctx.lineTo(px, py);
  }
  ctx.lineWidth = width;
  ctx.stroke();

  if (depth > 0) {
    const children = random() < 0.35 ? 3 : 2;
    for (let c = 0; c < children; c++) {
      grow(px, py, heading + between(-0.9, 0.9), length * between(0.55, 0.8), width * 0.72, depth - 1, layer);
    }
  }

  if (depth === 0 && random() < layer.tipChance) {
    layer.tips.push([px, py]);
  }
}

function paintLayer(layer) {
  const sheet = document.createElement('canvas');
  sheet.width = W;
  sheet.height = H;
  const target = ctx;
  ctx = sheet.getContext('2d');
  ctx.strokeStyle = layer.colour;
  ctx.lineCap = 'round';
  for (const [x, y, angle] of layer.roots) {
    grow(x, y, angle, layer.length, layer.width, layer.depth, layer);
  }

  for (const [x, y] of layer.tips) {
    ctx.beginPath();
    ctx.fillStyle = layer.node;
    ctx.arc(x, y, between(layer.nodeSize * 0.6, layer.nodeSize), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx = target;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${layer.shadow}px)`;
  ctx.drawImage(sheet, 0, 0);
  ctx.filter = layer.blur ? `blur(${layer.blur}px)` : 'none';
  ctx.drawImage(sheet, 0, 0);
  ctx.restore();
}

function paintGrain() {
  const grain = ctx.getImageData(0, 0, W, H);
  const data = grain.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (random() - 0.5) * 10;
    data[i] += n;
    data[i + 1] += n;
    data[i + 2] += n;
  }
  ctx.putImageData(grain, 0, 0);
}

paintGround();

const far = { roots: [], tips: [], tipChance: 0.18, blur: 6, colour: 'rgba(124, 203, 160, 0.16)', glow: 'rgba(124, 203, 160, 0.3)', shadow: 12, node: 'rgba(124, 203, 160, 0.35)', nodeSize: 7, length: 260, width: 5, depth: 6 };
for (let i = 0; i < 9; i++) {
  far.roots.push([between(0, W), H + 20, between(-Math.PI * 0.85, -Math.PI * 0.15)]);
}
paintLayer(far);

const mid = { roots: [], tips: [], tipChance: 0.3, blur: 1.5, colour: 'rgba(124, 203, 160, 0.42)', glow: 'rgba(124, 203, 160, 0.55)', shadow: 16, node: 'rgba(180, 236, 205, 0.85)', nodeSize: 6, length: 220, width: 3.2, depth: 6 };
for (let i = 0; i < 6; i++) {
  mid.roots.push([between(-100, W + 100), between(H * 0.7, H + 40), between(-Math.PI * 0.8, -Math.PI * 0.2)]);
}
mid.roots.push([-20, H * 0.35, between(-0.2, 0.2)]);
mid.roots.push([W + 20, H * 0.55, Math.PI + between(-0.2, 0.2)]);
paintLayer(mid);

const near = { roots: [], tips: [], tipChance: 0.45, blur: 0, colour: 'rgba(160, 225, 190, 0.75)', glow: 'rgba(124, 203, 160, 0.9)', shadow: 22, node: 'rgba(236, 250, 240, 1)', nodeSize: 5, length: 170, width: 2.2, depth: 5 };
for (let i = 0; i < 4; i++) {
  near.roots.push([between(0, W), H + 10, between(-Math.PI * 0.75, -Math.PI * 0.25)]);
}
paintLayer(near);

const amber = { roots: [[W * 0.86, H + 10, -Math.PI * 0.6], [W * 0.1, H + 10, -Math.PI * 0.35]], tips: [], tipChance: 0.5, blur: 0.5, colour: 'rgba(226, 180, 95, 0.45)', glow: 'rgba(226, 180, 95, 0.7)', shadow: 18, node: 'rgba(255, 226, 170, 1)', nodeSize: 5, length: 150, width: 2, depth: 4 };
paintLayer(amber);

paintGrain();

</script>
</body>
</html>
