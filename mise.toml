[tools]
"github:nextest-rs/nextest" = "cargo-nextest-0.9.149"
rust = "1.96.0"
java = "jetbrains-jcef-21.0.11-b1163.116"
gradle = "9.8.2"
node = "22"
uv = "0.13.5"
"pipx:radicale" = "3.9.0"
mold = "3.0.0"

[env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C link-arg=-fuse-ld=mold"

[tasks.test-rust]
description = "Rust tests in parallel; needs the throwaway Postgres on 55499"
env = { CARGO_TARGET_DIR = "{{env.HOME}}/.cache/mycelium-target", CARGO_INCREMENTAL = "0", MYCELIUM_TEST_DATABASE_URL = "postgres://postgres:pw@127.0.0.1:55499/postgres" }
run = "cargo nextest run --workspace --no-fail-fast; status=$?; mise run prune; exit $status"

[tasks.prune]
description = "Delete stale test binaries and the incremental cache from the Rust target directory"
run = """
deps="$HOME/.cache/mycelium-target/debug/deps"
rm -rf "$HOME/.cache/mycelium-target/debug/incremental"
cd "$deps" || exit 0
for name in $(ls | grep -E -- '-[0-9a-f]{16}$' | sed -E 's/-[0-9a-f]{16}$//' | sort -u); do
  ls -t | grep -E -- "^$name-[0-9a-f]{16}$" | tail -n +2 | while read -r stale; do
    [ -x "$stale" ] && [ -f "$stale" ] && rm -f -- "$stale" "$stale.d"
  done
done
"""

[tasks.test-clients]
description = "Client tests across JVM forks, plus the web and Android compiles"
dir = "clients"
run = "./gradlew :shared:jvmTest :desktop:test :web:compileKotlinWasmJs :androidApp:compileDebugKotlin --continue"

[tasks.test-editor]
description = "Design editor unit tests"
dir = "clients/editor"
run = "pnpm install && pnpm test"

[tasks.test]
description = "Every suite, Rust first, then the clients and the editor"
run = [{ task = "test-rust" }, { task = "test-clients" }, { task = "test-editor" }]
